[package]
name = "weavecoder"
version = "0.67.0"
description = "Possibly the greatest coding agent ever built — blazing-fast TUI, multi-model, swarm coordination, 30+ tools"
edition = "2024"
autobins = false

[workspace]
members = [
    ".",
    "crates/wvc-agent-runtime",
    "crates/wvc-app-core",
    "crates/wvc-base",
    "crates/wvc-tui",
    "crates/wvc-build-meta",
    "crates/wvc-ambient-types",
    "crates/wvc-auth-types",
    "crates/wvc-embedding",
    "crates/wvc-gateway-types",
    "crates/wvc-import-core",
    "crates/wvc-pdf",
    "crates/wvc-logging",
    "crates/wvc-background-types",
    "crates/wvc-batch-types",
    "crates/wvc-build-support",
    "crates/wvc-compaction-core",
    "crates/wvc-config-types",
    "crates/wvc-command-risk",
    "crates/wvc-core",
    "crates/wvc-fuzzy",
    "crates/wvc-code-graph",
    "crates/wvc-harness-api",
    "crates/wvc-harness-api-server",
    "crates/wvc-sdk",
    "crates/wvc-desktop2",
    "crates/wvc-memory-types",
    "crates/wvc-message-types",
    "crates/wvc-overnight-core",
    "crates/wvc-plan",
    "crates/wvc-productivity-core",
    "crates/wvc-swarm-core",
    "crates/wvc-protocol",
    "crates/wvc-selfdev-types",
    "crates/wvc-session-types",
    "crates/wvc-setup-hints",
    "crates/wvc-storage",
    "crates/wvc-code-graph",
    "crates/wvc-side-panel-types",
    "crates/wvc-azure-auth",
    "crates/wvc-notify-email",
    "crates/wvc-provider-metadata",
    "crates/wvc-provider-env",
    "crates/wvc-provider-core",
    "crates/wvc-provider-bedrock",
    "crates/wvc-provider-anthropic",
    "crates/wvc-provider-antigravity",
    "crates/wvc-provider-copilot",
    "crates/wvc-provider-openrouter",
    "crates/wvc-provider-openai",
    "crates/wvc-provider-gemini",
    "crates/wvc-provider-gemini-runtime",
    "crates/wvc-provider-cursor-runtime",
    "crates/wvc-provider-antigravity-runtime",
    "crates/wvc-provider-copilot-runtime",
    "crates/wvc-provider-claude-cli-runtime",
    "crates/wvc-provider-openrouter-runtime",
    "crates/wvc-provider-anthropic-runtime",
    "crates/wvc-provider-openai-runtime",
    "crates/wvc-provider-doctor",
    "crates/wvc-tui-markdown",
    "crates/wvc-tui-messages",
    "crates/wvc-usage-types",
    "crates/wvc-tui-core",
    "crates/wvc-tui-mermaid",
    "crates/wvc-task-types",
    "crates/wvc-transport",
    "crates/wvc-tool-core",
    "crates/wvc-tool-types",
    "crates/wvc-tui-account-picker",
    "crates/wvc-tui-anim",
    "crates/wvc-tui-render",
    "crates/wvc-tui-visual-debug",
    "crates/wvc-tui-session-picker",
    "crates/wvc-tui-style",
    "crates/wvc-tui-permissions",
    "crates/wvc-tui-tool-display",
    "crates/wvc-tui-usage-overlay",
    "crates/wvc-update-core",
    "crates/wvc-terminal-launch",
    "crates/wvc-terminal-image",
    "crates/wvc-telemetry-core",
    "crates/wvc-tui-workspace",
    "crates/wvc-render-core",
]

[lib]
name = "weavecoder"
path = "src/lib.rs"

[[bin]]
name = "wvc"
path = "src/main.rs"

[[bin]]
name = "test_api"
path = "src/bin/test_api.rs"

[[bin]]
name = "wvc-harness"
path = "src/bin/harness.rs"

[[bin]]
name = "session_memory_bench"
path = "src/bin/session_memory_bench.rs"
required-features = ["dev-bins"]

[[bin]]
name = "memory_recall_bench"
path = "src/bin/memory_recall_bench.rs"
required-features = ["dev-bins"]

[[bin]]
name = "mermaid_side_panel_probe"
path = "src/bin/mermaid_side_panel_probe.rs"
required-features = ["dev-bins"]

[[bin]]
name = "tui_bench"
path = "src/bin/tui_bench.rs"
required-features = ["dev-bins"]

[dependencies]
# Memory allocator (reduces fragmentation for long-running server)
tikv-jemallocator = { version = "0.6", features = ["unprefixed_malloc_on_supported_platforms"], optional = true }

# Async runtime
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
futures = "0.3"
async-trait = "0.1"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "charset", "http2", "system-proxy", "rustls-tls", "rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-native-roots"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive"] }

# File operations

# Utilities
dirs = "5"               # home directory
anyhow = "1"
libc = "0.2"             # Unix system calls (flock)
chrono = { version = "0.4", features = ["serde"] }

# Embeddings (local inference) - behind feature flag (163 crates, slow to compile)

# OAuth
sha2 = "0.10"
hex = "0.4"
open = "5"               # Open URLs in browser
wvc-tui-style = { path = "crates/wvc-tui-style" }
wvc-tui-session-picker = { path = "crates/wvc-tui-session-picker", features = ["serde"] }

# Streaming
tokio-stream = "0.1"

# TUI
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }

# Markdown & syntax highlighting

# PDF parsing (behind feature flag)
wvc-build-meta = { path = "crates/wvc-build-meta" }
# Tiny leaf helpers (console/env/fs/id) used directly by the cli layer.
# Presentation layer: the terminal UI (`tui`) + offline replay (`video_export`),
# compiled as a separate rustc unit. It re-exports the application core
# (`wvc-app-core`, which re-exports `wvc-base`), so the root crate (cli +
# bin) re-exports everything via `pub use jcode_tui::*`. default-features=false
# so the root feature set fully controls the downstream features (see
# [features]).
wvc-tui = { path = "crates/wvc-tui", default-features = false }
# `jcode provider-doctor` / provider diagnostics; sits downstream of wvc-base
# so doctor edits do not rebuild the base -> app-core -> tui spine.
wvc-provider-doctor = { path = "crates/wvc-provider-doctor" }
# Gemini provider runtime; sits downstream of wvc-base so gemini edits do
# not rebuild the base -> app-core -> tui spine. Registered with the external
# provider registry at startup (src/cli/startup.rs).
wvc-provider-gemini-runtime = { path = "crates/wvc-provider-gemini-runtime" }
wvc-provider-cursor-runtime = { path = "crates/wvc-provider-cursor-runtime" }
wvc-provider-antigravity-runtime = { path = "crates/wvc-provider-antigravity-runtime" }
wvc-provider-copilot-runtime = { path = "crates/wvc-provider-copilot-runtime" }
wvc-provider-claude-cli-runtime = { path = "crates/wvc-provider-claude-cli-runtime" }
wvc-provider-openrouter-runtime = { path = "crates/wvc-provider-openrouter-runtime" }
wvc-provider-anthropic-runtime = { path = "crates/wvc-provider-anthropic-runtime" }
wvc-provider-openai-runtime = { path = "crates/wvc-provider-openai-runtime" }
wvc-selfdev-types = { path = "crates/wvc-selfdev-types" }

# Archive extraction (for auto-update)
tempfile = "3"

[features]
# Include local ONNX/tokenizer embeddings in default builds so memory recall,
# semantic retrieval, and embedding-backed features work out of the box.
# Use `JCODE_DEV_FEATURE_PROFILE=minimal` for compile-speed probes that need
# to skip optional default feature stacks.
default = ["pdf", "embeddings", "bedrock"]
dev-bins = ["wvc-tui/dev-bins"]
jemalloc = [
    "dep:tikv-jemallocator",
    "tikv-jemallocator/stats",
    "wvc-tui/jemalloc",
]
jemalloc-prof = [
    "jemalloc",
    "tikv-jemallocator/profiling",
    "wvc-tui/jemalloc-prof",
]
# Local embeddings and PDF extraction live in wvc-base / wvc-app-core;
# these features just forward down the stack.
embeddings = ["wvc-tui/embeddings"]
# Live AWS Bedrock support (the AWS SDK stack) lives in wvc-provider-bedrock;
# forwards down through wvc-tui -> wvc-app-core -> wvc-base.
bedrock = ["wvc-tui/bedrock"]
# Internal release feature: build a supported OpenSSL inside the CentOS 7
# compatibility image while preserving the glibc 2.17 runtime baseline.
linux-compat-vendored-openssl = ["wvc-tui/linux-compat-vendored-openssl"]
mmdr-size-api = ["wvc-tui/mmdr-size-api"]
pdf = ["wvc-tui/pdf"]

# The harness API bridge ships inside the released binary as `jcode api-bridge`.
# SDK users must not need a Rust toolchain to reach the API: requiring
# `cargo run -p wvc-harness-api-server` made the TypeScript SDK unusable for
# anyone who installed jcode from a release artifact. Unix-only because the
# bridge listens on a Unix socket.
[target.'cfg(unix)'.dependencies]
wvc-harness-api-server = { path = "crates/wvc-harness-api-server" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
global-hotkey = "0.7"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSThread",
    "NSRunLoop",
    "NSDate",
    "NSTimer",
    "NSUserDefaults",
    "NSValue",
    "NSAttributedString",
    "NSDictionary",
    "block2",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSAppearance",
    "NSApplication",
    "NSResponder",
    "NSStatusBar",
    "NSStatusItem",
    "NSStatusBarButton",
    "NSButton",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSFont",
    "NSFontDescriptor",
    "NSImage",
    "NSAttributedString",
    "NSMenu",
    "NSMenuItem",
    "NSRunningApplication",
] }

[profile.release]
opt-level = 1
debug = 0
codegen-units = 256
incremental = true

[profile.selfdev]
inherits = "release"
opt-level = 0

# Full LTO release for stable/distribution builds
[profile.release-lto]
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = false

[profile.dev]
debug = 0
incremental = true

[profile.dev.package."*"]
opt-level = 0

# Keep the idle-animation math kernels fully optimized even in debug-style
# builds. This crate is pure, dependency-free numeric code (the trig-heavy 3D
# samplers that otherwise dominate idle CPU). Pinning it to opt-level = 3 here
# means the optimized object is compiled once and reused across iterative
# dev/selfdev rebuilds, since it only recompiles when the animation code itself
# changes. The "*" glob above sets the default for dependencies; these explicit
# package entries take precedence for this one crate in each profile.
[profile.dev.package."wvc-tui-anim"]
opt-level = 3

[profile.selfdev.package."wvc-tui-anim"]
opt-level = 3

[profile.test.package."wvc-tui-anim"]
opt-level = 3

# The fuzzy matcher runs a char-level DP over every picker entry on every
# keystroke (e.g. /model search across hundreds of routes). Like the anim
# kernels above, it is small, pure, dependency-free code that rarely changes,
# so keeping it fully optimized in dev/selfdev builds costs one compile and
# removes visible input lag in unoptimized builds.
[profile.dev.package."wvc-fuzzy"]
opt-level = 3

[profile.selfdev.package."wvc-fuzzy"]
opt-level = 3

[profile.test.package."wvc-fuzzy"]
opt-level = 3

[profile.release.package."wvc-fuzzy"]
opt-level = 3

# Keep the terminal render stack optimized even in dev/selfdev/test builds.
#
# Every TUI frame walks ratatui buffers cell-by-cell and re-measures visible
# text with unicode-width/unicode-segmentation. At opt-level = 0 those inner
# loops dominated live-client profiles (perf showed str_width, grapheme
# bsearch, and Buffer::index_of_opt as the top symbols) and pushed a routine
# full frame to ~12ms p50 / 21ms p95, which reads as input-line lag while
# streaming saturates the redraw loop. These are stable third-party crates
# that almost never recompile, so pinning them is a one-time compile cost
# (same rationale as wvc-tui-anim above).
[profile.dev.package.ratatui]
opt-level = 3
[profile.selfdev.package.ratatui]
opt-level = 3
[profile.test.package.ratatui]
opt-level = 3

[profile.dev.package.ratatui-core]
opt-level = 3
[profile.selfdev.package.ratatui-core]
opt-level = 3
[profile.test.package.ratatui-core]
opt-level = 3

[profile.dev.package.ratatui-widgets]
opt-level = 3
[profile.selfdev.package.ratatui-widgets]
opt-level = 3
[profile.test.package.ratatui-widgets]
opt-level = 3

[profile.dev.package.ratatui-crossterm]
opt-level = 3
[profile.selfdev.package.ratatui-crossterm]
opt-level = 3
[profile.test.package.ratatui-crossterm]
opt-level = 3

[profile.dev.package.crossterm]
opt-level = 3
[profile.selfdev.package.crossterm]
opt-level = 3
[profile.test.package.crossterm]
opt-level = 3

[profile.dev.package.unicode-width]
opt-level = 3
[profile.selfdev.package.unicode-width]
opt-level = 3
[profile.test.package.unicode-width]
opt-level = 3

[profile.dev.package.unicode-segmentation]
opt-level = 3
[profile.selfdev.package.unicode-segmentation]
opt-level = 3
[profile.test.package.unicode-segmentation]
opt-level = 3

[profile.dev.package.unicode-truncate]
opt-level = 3
[profile.selfdev.package.unicode-truncate]
opt-level = 3
[profile.test.package.unicode-truncate]
opt-level = 3

[profile.dev.package.unicode-linebreak]
opt-level = 3
[profile.selfdev.package.unicode-linebreak]
opt-level = 3
[profile.test.package.unicode-linebreak]
opt-level = 3

[profile.dev.package.compact_str]
opt-level = 3
[profile.selfdev.package.compact_str]
opt-level = 3
[profile.test.package.compact_str]
opt-level = 3

# Keep the text-shaping stack optimized even in dev/selfdev/test builds.
#
# cosmic-text + rustybuzz + ttf-parser + swash + yazi do all of the desktop
# transcript glyph shaping. At opt-level = 0 they are 15-40x slower, which made
# scrolling real (emoji/markdown-heavy) transcripts janky in dev/selfdev builds
# even though the production release build was smooth. These are stable
# third-party crates that almost never recompile, so pinning them to opt-level =
# 3 costs a one-time compile and is then reused across every iterative jcode
# rebuild (same rationale as wvc-tui-anim above). It does NOT slow down
# recompiles of jcode's own crates.
[profile.dev.package.cosmic-text]
opt-level = 3
[profile.selfdev.package.cosmic-text]
opt-level = 3
[profile.test.package.cosmic-text]
opt-level = 3

[profile.dev.package.rustybuzz]
opt-level = 3
[profile.selfdev.package.rustybuzz]
opt-level = 3
[profile.test.package.rustybuzz]
opt-level = 3

[profile.dev.package.ttf-parser]
opt-level = 3
[profile.selfdev.package.ttf-parser]
opt-level = 3
[profile.test.package.ttf-parser]
opt-level = 3

[profile.dev.package.swash]
opt-level = 3
[profile.selfdev.package.swash]
opt-level = 3
[profile.test.package.swash]
opt-level = 3

[profile.dev.package.yazi]
opt-level = 3
[profile.selfdev.package.yazi]
opt-level = 3
[profile.test.package.yazi]
opt-level = 3

[profile.dev.package.fontdb]
opt-level = 3
[profile.selfdev.package.fontdb]
opt-level = 3
[profile.test.package.fontdb]
opt-level = 3

# Keep the raster image pipeline optimized in dev/selfdev/test builds.
#
# Inline transcript images decode (png/zune-jpeg/fdeflate/miniz_oxide), resize
# (image), and base64-encode (kitty transmit) at draw time; at opt-level 0 a
# single screenshot costs 100-200ms per decode/resize, which reads as input
# lag. These are pure pixel crates with no jcode logic, so optimizing them
# does not hurt rebuild times for our own code.
[profile.dev.package.image]
opt-level = 3
[profile.selfdev.package.image]
opt-level = 3
[profile.test.package.image]
opt-level = 3

[profile.dev.package.png]
opt-level = 3
[profile.selfdev.package.png]
opt-level = 3
[profile.test.package.png]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.selfdev.package.zune-jpeg]
opt-level = 3
[profile.test.package.zune-jpeg]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3
[profile.selfdev.package.fdeflate]
opt-level = 3
[profile.test.package.fdeflate]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.selfdev.package.miniz_oxide]
opt-level = 3
[profile.test.package.miniz_oxide]
opt-level = 3

[profile.dev.package.base64]
opt-level = 3
[profile.selfdev.package.base64]
opt-level = 3
[profile.test.package.base64]
opt-level = 3

# session_search scans multi-megabyte session files with memchr-based
# case-insensitive matching; keep the SIMD scanner optimized everywhere.
[profile.dev.package.memchr]
opt-level = 3
[profile.selfdev.package.memchr]
opt-level = 3
[profile.test.package.memchr]
opt-level = 3

# Keep the desktop2 (winit + wgpu + Vello + Parley) render stack optimized in
# dev/selfdev/test builds.
#
# Every desktop2 frame re-encodes the scene (vello/vello_encoding/peniko),
# flattens paths (kurbo: the halftone donut alone is thousands of circles per
# frame), shapes and rasterizes text (parley/fontique/skrifa/harfrust/
