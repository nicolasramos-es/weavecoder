# opt-level 0 those inner loops are 15-40x slower, which made animations and
# streaming visibly laggy in selfdev builds while the same code was smooth at
# opt-level 3. These are stable third-party crates that almost never
# recompile, so pinning them costs one compile and does not slow rebuilds of
# jcode's own crates (same rationale as the ratatui/cosmic-text pins above).
[profile.dev.package.vello]
opt-level = 3
