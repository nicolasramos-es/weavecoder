[package]
name = "wvc-build-support"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
wvc-core = { path = "../wvc-core" }
wvc-selfdev-types = { path = "../wvc-selfdev-types" }
wvc-storage = { path = "../wvc-storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
