[package]
name = "wvc-session-cache"
version = "0.1.0"
edition = "2024"
description = "In-memory session cache for weavecoder: LRU caching for code-search and chat completions"
publish = false

[dependencies]
anyhow = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
wvc-code-graph = { path = "../wvc-code-graph" }

[dev-dependencies]
tempfile = "3"
