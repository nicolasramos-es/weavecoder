[package]
name = "wvc-provider-openai"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
futures = "0.3"
wvc-core = { path = "../wvc-core" }
wvc-logging = { path = "../wvc-logging" }
wvc-message-types = { path = "../wvc-message-types" }
wvc-provider-core = { path = "../wvc-provider-core" }
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
