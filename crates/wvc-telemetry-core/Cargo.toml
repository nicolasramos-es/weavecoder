[package]
name = "wvc-telemetry-core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "wvc_telemetry_core"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
wvc-build-meta = { path = "../wvc-build-meta" }
wvc-core = { path = "../wvc-core" }
wvc-logging = { path = "../wvc-logging" }
wvc-provider-core = { path = "../wvc-provider-core" }
wvc-selfdev-types = { path = "../wvc-selfdev-types" }
wvc-storage = { path = "../wvc-storage" }
wvc-usage-types = { path = "../wvc-usage-types" }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "charset", "http2", "system-proxy", "rustls-tls", "rustls-tls-native-roots"] }
serde_json = "1"
walkdir = "2"
tokio = { version = "1", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
