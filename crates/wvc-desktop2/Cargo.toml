[package]
name = "wvc-desktop2"
version = "0.1.0"
edition = "2024"
publish = false
description = "Greenfield jcode desktop app: winit + wgpu + Vello + Parley over the harness API"

[dependencies]
anyhow = "1"
arboard = { version = "3", features = ["wayland-data-control"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
wvc-build-meta = { path = "../wvc-build-meta" }
wvc-math = { path = "../wvc-math" }
wvc-sdk = { path = "../wvc-sdk" }
wvc-render-core = { path = "../wvc-render-core" }
libc = "0.2"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-onig"] }
unicode-width = "0.2"
parley = "0.11"
pollster = "0.3"
serde_json = "1"
vello = "0.9"
winit = "0.30"

[[bin]]
name = "wvc-desktop2"
path = "src/main.rs"
