[package]
name = "wvc-tool-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "wvc_tool_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
wvc-agent-runtime = { path = "../wvc-agent-runtime" }
wvc-message-types = { path = "../wvc-message-types" }
wvc-tool-types = { path = "../wvc-tool-types" }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
