[package]
name = "wvc-tui"
version = "0.1.0"
edition = "2024"
publish = false

# Presentation layer for jcode: the terminal UI (`tui`) and the offline replay
# `video_export`, extracted out of the monolithic root `jcode` crate so they
# compile as a separate rustc unit. This crate builds on top of the application
# core (`wvc-app-core`) and re-exports it via `pub use wvc_app_core::*`, so
# every existing `crate::<module>` path (e.g. `crate::config`, `crate::server`)
# keeps resolving unchanged across the tui code that was moved here. The root
# `jcode` crate (cli + bin) in turn re-exports this crate via
# `pub use wvc_tui::*`.

[lib]
name = "wvc_tui"
path = "src/lib.rs"

[dependencies]
# Application core (server, agent, provider, auth, session, tool, config, ...).
# Re-exported via `pub use wvc_app_core::*` in lib.rs. default-features=false
# so this crate (and ultimately the root crate) controls app-core's features.
wvc-app-core = { path = "../wvc-app-core", default-features = false }

# Pure math kernels for the idle animations (3D samplers, glyph chooser,
# HSV->RGB). Pinned to opt-level = 3 in all profiles via workspace Cargo.toml so
# the hot trig loops stay optimized even in debug/selfdev builds.
wvc-tui-anim = { path = "../wvc-tui-anim" }

# Async runtime
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

# Utilities
anyhow = "1"
libc = "0.2"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
dirs = "5"
similar = "2"
tempfile = "3"
open = "5"

# OAuth / hashing helpers used by the login + account UI
base64 = "0.22"
sha2 = "0.10"
rand = "0.9.3"
hex = "0.4"
url = "2"
urlencoding = "2"

# TUI
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
unicode-width = "0.2"

# Presentation-layer workspace crates
wvc-build-meta = { path = "../wvc-build-meta" }
wvc-logging = { path = "../wvc-logging" }
wvc-core = { path = "../wvc-core" }
wvc-fuzzy = { path = "../wvc-fuzzy" }
wvc-config-types = { path = "../wvc-config-types" }
wvc-selfdev-types = { path = "../wvc-selfdev-types" }
wvc-session-types = { path = "../wvc-session-types" }
wvc-provider-core = { path = "../wvc-provider-core" }
wvc-tui-markdown = { path = "../wvc-tui-markdown" }
wvc-tui-messages = { path = "../wvc-tui-messages" }
wvc-tui-core = { path = "../wvc-tui-core" }
wvc-tui-mermaid = { path = "../wvc-tui-mermaid" }
wvc-tui-account-picker = { path = "../wvc-tui-account-picker" }
wvc-tui-render = { path = "../wvc-tui-render" }
wvc-tui-visual-debug = { path = "../wvc-tui-visual-debug" }
wvc-tui-session-picker = { path = "../wvc-tui-session-picker", features = ["serde"] }
wvc-tui-style = { path = "../wvc-tui-style" }
terminal-colorsaurus = "1.0"
wvc-tui-permissions = { path = "../wvc-tui-permissions" }
wvc-tui-tool-display = { path = "../wvc-tui-tool-display" }
wvc-tui-usage-overlay = { path = "../wvc-tui-usage-overlay" }
wvc-terminal-image = { path = "../wvc-terminal-image" }
wvc-productivity-core = { path = "../wvc-productivity-core" }
wvc-tui-workspace = { path = "../wvc-tui-workspace" }

[features]
default = ["pdf", "embeddings", "bedrock"]
# Exposes bench-only debug helpers (e.g. debug_copy_selection_text_for_bench)
# consumed by the dev `tui_bench` binary in the root crate.
dev-bins = []
# Forwarded to app-core (and onward to wvc-base) so the root crate's feature
# set fully controls the optional stacks.
jemalloc = ["wvc-app-core/jemalloc"]
jemalloc-prof = ["wvc-app-core/jemalloc-prof"]
embeddings = ["wvc-app-core/embeddings"]
pdf = ["wvc-app-core/pdf"]
bedrock = ["wvc-app-core/bedrock"]
linux-compat-vendored-openssl = ["wvc-app-core/linux-compat-vendored-openssl"]
mmdr-size-api = ["wvc-tui-mermaid/mmdr-size-api"]
# Forwards the application core's `test-support` feature (and onward to
# wvc-base) so downstream crates' test targets can reach the whole stack's
# test helpers. Never enabled in normal (non-test) builds.
test-support = ["wvc-app-core/test-support"]

[dev-dependencies]
# Enables the downstream test-support helpers for *this* crate's own test
# target. Feature unification applies this only to test/bench/example builds.
wvc-app-core = { path = "../wvc-app-core", default-features = false, features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
global-hotkey = "0.7"
